<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Registro de una cuenta de espectador en Comet."><title>Comet · Crear cuenta</title><link rel="stylesheet" href="css/portal.css"></head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-visual"><div class="auth-copy"><span class="eyebrow">Perfil personal</span><h1>Guarda lo que te inspira.</h1><p>Las cuentas nuevas reciben el rol Espectador. Los permisos administrativos sólo pueden asignarse desde el panel protegido.</p></div></section>
    <section class="auth-card">
      <a class="brand" href="index.html"><span class="brand-mark">C</span> COMET</a><span class="eyebrow" style="margin-top:34px">Nueva cuenta</span><h2>Crea tu perfil</h2>
      <form id="registerForm" class="form-grid" novalidate>
        <label class="field"><span>Nombre</span><input name="nombre" autocomplete="name" minlength="2" maxlength="80" required></label>
        <label class="field"><span>Correo</span><input name="correo" type="email" autocomplete="email" maxlength="254" required></label>
        <label class="field"><span>Contraseña</span><input name="contraseña" type="password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="passwordHelp" required><small id="passwordHelp" class="muted">Incluye al menos una letra y un número.</small></label>
        <label class="field"><span>Confirmar contraseña</span><input name="confirmacion" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
        <button class="button" type="submit">Crear cuenta de espectador</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p><p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </section>
  </main><script src="js/theme-settings.js"></script><script src="js/register.js"></script>
</body></html>
